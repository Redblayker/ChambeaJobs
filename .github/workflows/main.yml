name: Build Docs PDF

on:
  push:
    branches: [ master ]
  release:
    types: [ published ]

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install md-to-pdf
        run: |
          npm install -g md-to-pdf

      - name: Generate PDF from Markdown (md-to-pdf)
        run: |
          # Generate PDF; md-to-pdf renders Mermaid diagrams embedded in code fences
          md-to-pdf DOCUMENTACION_COMPLETA.md --output DOCUMENTACION_COMPLETA.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf
          path: DOCUMENTACION_COMPLETA.pdf
