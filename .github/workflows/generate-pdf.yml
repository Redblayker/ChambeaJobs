name: Generate PDF from Markdown
  
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**.md'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Pandoc and TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex

      - name: Generate PDF
        run: |
          pandoc docs/ChambeaJobs_Propuestas_CandidatoEmpresaMonetizacion.md \
            -o docs/ChambeaJobs_Propuestas_CandidatoEmpresaMonetizacion.pdf \
            --pdf-engine=xelatex -V geometry:margin=1in -V fontsize=11pt

      - name: Commit PDF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ChambeaJobs_Propuestas_CandidatoEmpresaMonetizacion.pdf
          git commit -m "Auto-generate PDF from Markdown" || echo "No changes to commit"
          git push
